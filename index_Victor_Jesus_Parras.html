<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style_Victor_Jesus_Parras.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="headerIMG">
        <img
          src="https://i.pinimg.com/1200x/de/f7/b6/def7b694904830d5804ee5975b69e9ed.jpg"
          alt="Logo de página de hotel"
        />
      </div>
      <div class="slogan">
        <h1>¿Quieres dormir agusto? ¡Este es tu sitio!</h1>
      </div>
      <nav>
        <button class="headbutton info"><p>Información</p></button>
        <button class="headbutton booking"><p>Reservas</p></button>
        <button class="headbutton contact"><p>Contacto</p></button>
      </nav>
    </header>
    <main>
      <div class="sections">
        <section id="info">Info section</section>
        <section id="booking">Booking section</section>
        <section id="contact">Contact section</section>
      </div>
    </main>
    <footer>
      <div class="Name">
        <p>Víctor Jesús Parras Rumbado</p>
      </div>
      <div class="github_link">
        <a href="https://github.com/Vipo89">
          <img
            src="github_logo.png"
            alt="Logo que dirige al github del creador de la web"
          />
        </a>
      </div>
    </footer>
  </body>
</html>
